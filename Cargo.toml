[package]
name = "talons-rewinged"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4"
nom = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinyaudio = "2"

[target.'cfg(not(windows))'.dependencies]
sdl2 = "0.39"

[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.39", features = ["bundled", "static-link"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
